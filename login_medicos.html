<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <title>Login Médicos - Clínica</title>
  <style>
  html, body {
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    background:(135deg, #ffffff 0%);
  }
  .login-container {
    flex-grow: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .login-card {
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    padding: 40px;
    max-width: 450px;
    width: 100%;
  }
  .login-header {
    text-align: center;
    margin-bottom: 30px;
  }
  .login-header h2 {
    color: #0d6efd;
    font-weight: bold;
  }
  .form-control:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
  }
  .btn-login {
    background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
    border: none;
    padding: 12px;
    font-weight: bold;
  }
  .btn-login:hover {
    opacity: 0.9;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  .alert-custom {
    display: none;
  }
  footer {
    background: rgba(255,255,255,0.1);
    color: white;
  }
  html, body {
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  footer {
    margin-top: auto; /* empuja el footer al fondo */
  }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary" style="background: rgba(0,0,0,0.2);">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Clínica Salud+</a>
    </div>
  </nav>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h2> Portal Médicos</h2>
        <p class="text-muted">Ingresa tus credenciales</p>
      </div>

      <div id="alertMsg" class="alert alert-danger alert-custom" role="alert">
        <strong>Error:</strong> Usuario o contraseña incorrectos
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="usuario" placeholder="Ingresa tu usuario" required>
        </div>
        
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
        </div>

        <button type="submit" class="btn btn-primary btn-login w-100">Iniciar Sesión</button>
      </form>


      <div class="mt-3 text-center">
        <a href="index.html" class="text-decoration-none">← Volver al inicio</a>
      </div>
    </div>
  </div>

  <script>
    // Credenciales de demostración (en producción esto debería estar en el backend)
    const credenciales = {
  'doctor': 'Doctor_2025!',
  'admin': 'AdminSegura#55',
  'medico': 'Medico%1234'
};

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const usuario = document.getElementById('usuario').value;
      const password = document.getElementById('password').value;
      const alertMsg = document.getElementById('alertMsg');

      // Validar credenciales
      if (credenciales[usuario] && credenciales[usuario] === password) {

        sessionStorage.setItem('usuario', usuario);

        // Login exitoso
        alertMsg.style.display = 'none';
        
        // Mostrar mensaje de éxito
        alertMsg.className = 'alert alert-success alert-custom';
        alertMsg.innerHTML = '<strong>¡Bienvenido!</strong> Redirigiendo...';
        alertMsg.style.display = 'block';
        
        // Redirigir después de 1 segundo
        setTimeout(() => {
          window.location.href = 'atender.html';
        }, 1000);
      } else {
        // Login fallido
        alertMsg.className = 'alert alert-danger alert-custom';
        alertMsg.innerHTML = '<strong>Error:</strong> Usuario o contraseña incorrectos';
        alertMsg.style.display = 'block';
        
        // Limpiar campos
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    });
  </script>

  <footer class="text-center p-3 bg-dark text-light">
  © 2025 Clínica Salud+ - Sistema de Gestión
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
